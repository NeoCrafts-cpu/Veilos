# Optional static host for the same Vite SPA that Vercel builds.
# Do not run a proof server here — Compact witnesses must stay on the operator machine.
services:
  - type: web
    name: velios-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && NODE_OPTIONS=--max-old-space-size=8192 pnpm build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /keys/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /zkir/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_VELIOS_NETWORK
        value: preview
