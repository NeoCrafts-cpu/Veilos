name: Wave 1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: node scripts/check-node.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @velios/shared-types test
      - run: pnpm --filter @velios/policy-engine test
      - run: pnpm --filter @velios/midnight test
      - run: pnpm --filter @velios/cli test
      - run: pnpm --filter @velios/credentials test
      - run: pnpm --filter @velios/identity test
      - run: pnpm --filter @velios/economy test
      - run: pnpm --filter @velios/governance test
      - run: pnpm --filter @velios/procurement test
      - run: pnpm --filter @velios/auditor test
      - run: pnpm --filter @velios/web test
      - run: pnpm --filter @velios/tests test

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @velios/contracts test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Retain public build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  integration:
    if: ${{ vars.VELIOS_REQUIRE_MIDNIGHT == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:up
      - run: pnpm compile:contracts
      - run: VELIOS_REQUIRE_MIDNIGHT=1 pnpm --filter @velios/tests test
      - run: pnpm env:down
        if: always()
